# PoC 用の push トリガー（workflow_dispatch は default ブランチに無いと発火できないため）。
# macos-session.yml を固定入力で呼び、tailnet 越しの操作を実 run で確認する。PoC 後に削除する。
name: macos-poc

on:
  push:
    branches: [macos-app-session]

jobs:
  session:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/macos-session.yml
    with:
      session: poc-mac
      runner: macos-15
      duration_minutes: "20"
      sample_app: "true"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
