# macOS runner の GUI セッションで macOS アプリを操作できるかを実測する診断 workflow。
# PoC 完了後に削除する（結果は PROJECT.md に転記する）。tailnet には参加しない（純粋にローカル計測）。
name: macos-diagnose

on:
  push:
    branches: [macos-app-session]
  workflow_dispatch:

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: GUI セッション・SIP を調査
        run: |
          echo "## runner env" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "os: ${{ matrix.os }}"
            echo "whoami: $(whoami)"
            echo "csrutil: $(csrutil status 2>&1 || true)"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "--- launchctl print gui ---"
            launchctl print "gui/$(id -u)" 2>&1 | head -20 || echo "launchctl print gui: 取得不可"
            echo "--- Aqua session (scutil) ---"
            echo 'show State:/Users/ConsoleUser' | scutil 2>&1 | head -10 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: サンプル macOS アプリをビルド・起動
        id: launch
        run: |
          ./macOSProject/build.sh
          APP="macOSProject/build/MacSample.app"
          open "$APP"
          sleep 5
          echo "--- running apps ---"
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1 || true

      - name: Xcode バージョンを取得（キャッシュキー用）
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' '_' | tr ' ' '.')" >> "$GITHUB_OUTPUT"

      - name: WDA-mac ビルドキャッシュを復元
        id: wda-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: wda-mac-dd/Build/Products
          key: wda-mac-v4.1.1-${{ runner.arch }}-${{ steps.xcode.outputs.version }}

      - name: WebDriverAgentMac を起動
        id: wda
        continue-on-error: true
        env:
          WDA_MAC_REF: v4.1.1
        run: |
          T0=$(date +%s)
          ./runner/start-wda-mac.sh 8100
          T1=$(date +%s)
          echo "wda_startup_seconds=$((T1 - T0))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: WDA-mac ビルドキャッシュを保存
        if: steps.wda-cache.outputs.cache-hit != 'true' && steps.wda.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: wda-mac-dd/Build/Products
          key: wda-mac-v4.1.1-${{ runner.arch }}-${{ steps.xcode.outputs.version }}

      - name: WDA-mac 経由で操作を実測
        if: steps.wda.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p artifacts
          BASE="http://127.0.0.1:8100"
          OS="${{ matrix.os }}"
          now_ms() { python3 -c 'import time;print(int(time.time()*1000))'; }
          element_id() { python3 -c 'import json,sys; v=json.load(sys.stdin).get("value",{}); print(v.get("ELEMENT") or v.get("element-6066-11e4-a52e-4f735466cecf") or "")' 2>/dev/null || true; }
          find_el() { curl -s -X POST "$BASE/session/$1/element" -H 'Content-Type: application/json' -d "{\"using\":\"accessibility id\",\"value\":\"$2\"}"; }
          save_shot() { # $1=out.png
            local tmp; tmp="$(mktemp)"
            curl -s "$BASE/screenshot" -o "$tmp"
            python3 -c "import json,base64,sys; d=json.load(open('$tmp')); open('$1','wb').write(base64.b64decode(d['value']))" 2>/dev/null \
              && echo "saved: $1 ($(wc -c < "$1") bytes)" || echo "screenshot decode 失敗"
          }
          echo "## WDA-mac operations ($OS)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

          echo "--- GET /status ---" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s "$BASE/status" | tee -a "$GITHUB_STEP_SUMMARY"; echo

          # session-less screenshot のレイテンシ
          T0=$(now_ms)
          curl -s "$BASE/screenshot" -o "artifacts/wda-shot-nosession-$OS.json"
          T1=$(now_ms)
          echo "screenshot_nosession_ms=$((T1 - T0))" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,base64; d=json.load(open('artifacts/wda-shot-nosession-$OS.json')); open('artifacts/wda-shot-nosession-$OS.png','wb').write(base64.b64decode(d['value'])); print('screenshot bytes:', len(d['value']))" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "screenshot decode 失敗"

          # セッション作成（サンプルアプリを対象に）
          echo "--- POST /session ---" | tee -a "$GITHUB_STEP_SUMMARY"
          T0=$(now_ms)
          SID=$(curl -s -X POST "$BASE/session" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"alwaysMatch":{"appium:bundleId":"com.bannzai.simtunnel.MacSample"},"firstMatch":[{}]}}' \
            | tee -a "$GITHUB_STEP_SUMMARY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sessionId",""))' 2>/dev/null || true)
          T1=$(now_ms)
          echo; echo "session_create_ms=$((T1 - T0)) sessionId=${SID}" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -n "$SID" ]; then
            # source（アクセシビリティツリー）取得。json 非対応のため xml
            curl -s "$BASE/source?format=xml" -o "artifacts/wda-source-$OS.xml"
            echo "source bytes: $(wc -c < "artifacts/wda-source-$OS.xml")" | tee -a "$GITHUB_STEP_SUMMARY"

            save_shot "artifacts/before-$OS.png" | tee -a "$GITHUB_STEP_SUMMARY"

            # clickButton を探してクリック
            EID=$(find_el "$SID" clickButton | element_id)
            echo "clickButton element: ${EID:-<not found>}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$EID" ]; then
              T0=$(now_ms)
              CLICK_RESP=$(curl -s -X POST "$BASE/session/$SID/element/$EID/click" -d '{}')
              T1=$(now_ms)
              echo "click_ms=$((T1 - T0)) resp=${CLICK_RESP}" | tee -a "$GITHUB_STEP_SUMMARY"
            fi

            # statusLabel を読み、クリックが反映されたか機械判定（機能的検証）
            SEID=$(find_el "$SID" statusLabel | element_id)
            if [ -n "$SEID" ]; then
              LABEL=$(curl -s "$BASE/session/$SID/element/$SEID/attribute/value" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' 2>/dev/null || true)
              echo "statusLabel after click: '${LABEL}'" | tee -a "$GITHUB_STEP_SUMMARY"
              [ "$LABEL" = "Clicked!" ] && echo "CLICK_VERIFIED=yes" | tee -a "$GITHUB_STEP_SUMMARY" || echo "CLICK_VERIFIED=no" | tee -a "$GITHUB_STEP_SUMMARY"
            fi

            # キー入力（inputField に value 設定）→ inputEcho で機能的検証
            IEID=$(find_el "$SID" inputField | element_id)
            if [ -n "$IEID" ]; then
              T0=$(now_ms)
              curl -s -X POST "$BASE/session/$SID/element/$IEID/value" -H 'Content-Type: application/json' -d '{"value":["hello"]}' >/dev/null
              T1=$(now_ms)
              echo "type_ms=$((T1 - T0))" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            EEID=$(find_el "$SID" inputEcho | element_id)
            if [ -n "$EEID" ]; then
              ECHO=$(curl -s "$BASE/session/$SID/element/$EEID/attribute/value" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' 2>/dev/null || true)
              echo "inputEcho after type: '${ECHO}'" | tee -a "$GITHUB_STEP_SUMMARY"
              [ "$ECHO" = "input: hello" ] && echo "TYPE_VERIFIED=yes" | tee -a "$GITHUB_STEP_SUMMARY" || echo "TYPE_VERIFIED=no" | tee -a "$GITHUB_STEP_SUMMARY"
            fi

            save_shot "artifacts/after-$OS.png" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: WDA-mac ログを退避
        if: always()
        run: |
          mkdir -p artifacts
          cp "${RUNNER_TEMP}"/wda-mac-*.log artifacts/ 2>/dev/null || true

      - name: artifact をアップロード
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: diagnose-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
